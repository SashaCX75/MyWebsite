  // Обновление текста страницы
  function updateLanguage(lang) {
    if (!texts[lang]) lang = 'en';
    const t = texts[lang];
    document.documentElement.lang = lang;
    document.title = t.title;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t[el.getAttribute('data-i18n')];
    });

    document.querySelectorAll('[data-i18n-list]').forEach(listEl => {
      listEl.innerHTML = '';
      t[listEl.getAttribute('data-i18n-list')].forEach(item => {
        const li = document.createElement('li');
        if (Array.isArray(item)) {
          const b = document.createElement('b');
          b.textContent = item[0] + ': ';
          li.appendChild(b);
          li.appendChild(document.createTextNode(item[1]));
        } else {
          li.textContent = item;
        }
        listEl.appendChild(li);
      });
    });

    document.querySelectorAll('.lang-switch .btn').forEach(btn => {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
  }

  // Назначение обработчиков клика на кнопки
  document.querySelectorAll('.lang-switch .btn').forEach(btn => {
    btn.addEventListener('click', () => updateLanguage(btn.getAttribute('data-lang')));
  });

  // Язык по умолчанию: ?lang=ru|uk|en, иначе язык браузера
  const params = new URLSearchParams(location.search);
  const browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  updateLanguage(params.get('lang') || browserLang);
</script>
